version: '3.8'

services:
  # ============ 数据存储服务 ============
  
  # PostgreSQL数据库
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: tara_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=automotive_security
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --locale=en_US.utf8
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backup:/backup
    networks:
      - tara_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d automotive_security"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis缓存和消息队列
  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    container_name: tara_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tara_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "admin123", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Chroma向量数据库
  chroma:
    image: chromadb/chroma:latest
    container_name: tara_chroma
    restart: unless-stopped
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - PERSIST_DIRECTORY=/chroma/chroma
      - CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER=chromadb.auth.basic.BasicAuthCredentialsProvider
      - CHROMA_SERVER_AUTH_CREDENTIALS_FILE=/chroma/auth.txt
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
      - ./docker/chroma/chroma_auth.txt:/chroma/auth.txt
    networks:
      - tara_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============ 反向代理服务 ============
  
  # Nginx反向代理和负载均衡
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: tara_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./logs/nginx:/var/log/nginx
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - redis
      - postgres
      - chroma
    networks:
      - tara_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============ 管理服务 ============
  
  # PGAdmin数据库管理
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tara_pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@tara.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - tara_network

  # Redis Commander - Redis管理界面
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: tara_redis_commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379:0:admin123
      - HTTP_USER=admin
      - HTTP_PASSWORD=admin123
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - tara_network

  # ============ 监控服务 ============
  
  # Prometheus监控
  prometheus:
    image: prom/prometheus:latest
    container_name: tara_prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./docker/config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - tara_network

  # Grafana可视化
  grafana:
    image: grafana/grafana:latest
    container_name: tara_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # 注释掉Grafana配置，因为目前没有这个目录
      # - ./docker/config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - tara_network

# ============ 数据卷 ============
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  chroma_data:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ============ 网络配置 ============
networks:
  tara_network:
    driver: bridge
    # 删除固定子网配置，让Docker自动分配不冲突的子网
    # ipam:
    #   config:
    #     - subnet: 172.20.0.0/16 